<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>待办清单 · 示例工具</title>
    <!--
      这是一个示例工具，用来演示「站内工具」怎么放。
      新建工具的步骤：
        1. 在 public/tools/ 下新建一个目录，比如 public/tools/my-tool/
        2. 把入口文件命名为 index.html（单文件工具直接写这一份就行）
        3. 构建后它的网址是 /tools/my-tool/
        4. 在 src/pages/tools.astro 的 tools 数组里加一行登记
      这个目录可以整个删掉，不影响其它功能。
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fdf8f9;
        --card: #ffffff;
        --text: #3a2e31;
        --muted: #8a7c80;
        --line: #f0dfe2;
        --accent: #e9546b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b161a;
          --card: #241d22;
          --text: #f2e9ec;
          --muted: #a3929a;
          --line: #3a2e34;
          --accent: #ed788c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
      }
      main { width: 100%; max-width: 480px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
      .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
      form { display: flex; border-bottom: 1px solid var(--line); }
      input[type="text"] {
        flex: 1; border: 0; background: transparent; color: var(--text);
        padding: 14px 16px; font-size: 15px; outline: none;
      }
      button {
        border: 0; background: transparent; color: var(--accent);
        font-weight: 600; padding: 0 18px; cursor: pointer; font-size: 14px;
      }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 16px; border-bottom: 1px solid var(--line);
      }
      li:last-child { border-bottom: 0; }
      li.done span { color: var(--muted); text-decoration: line-through; }
      li span { flex: 1; word-break: break-word; }
      .tick { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
      .del { color: var(--muted); font-size: 18px; padding: 0 4px; }
      .del:hover { color: var(--accent); }
      .empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 14px; }
      footer { margin-top: 16px; text-align: center; color: var(--muted); font-size: 12px; }
      a { color: var(--accent); text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>待办清单</h1>
      <p class="sub">示例工具 · 数据只存在这台设备的浏览器里</p>

      <div class="box">
        <form id="form">
          <input id="input" type="text" placeholder="要点什么…" autocomplete="off" />
          <button type="submit">添加</button>
        </form>
        <ul id="list"></ul>
      </div>

      <footer><a href="/tools/">← 回到工具箱</a></footer>
    </main>

    <script>
      const KEY = 'demo-todos';
      const form = document.getElementById('form');
      const input = document.getElementById('input');
      const list = document.getElementById('list');

      let todos = [];
      try {
        todos = JSON.parse(localStorage.getItem(KEY) || '[]');
      } catch {
        todos = [];
      }

      function save() {
        localStorage.setItem(KEY, JSON.stringify(todos));
      }

      function render() {
        list.innerHTML = '';

        if (todos.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = '还没有待办，上面加一条试试';
          list.appendChild(empty);
          return;
        }

        todos.forEach((todo, index) => {
          const li = document.createElement('li');
          if (todo.done) li.classList.add('done');

          const tick = document.createElement('input');
          tick.type = 'checkbox';
          tick.className = 'tick';
          tick.checked = todo.done;
          tick.addEventListener('change', () => {
            todos[index].done = tick.checked;
            save();
            render();
          });

          const text = document.createElement('span');
          text.textContent = todo.text;

          const del = document.createElement('button');
          del.className = 'del';
          del.type = 'button';
          del.textContent = '×';
          del.setAttribute('aria-label', '删除');
          del.addEventListener('click', () => {
            todos.splice(index, 1);
            save();
            render();
          });

          li.append(tick, text, del);
          list.appendChild(li);
        });
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        todos.push({ text, done: false });
        input.value = '';
        save();
        render();
      });

      render();
    </script>
  </body>
</html>
